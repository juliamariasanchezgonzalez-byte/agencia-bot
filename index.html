<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Aplicación de Tareas</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #4CAF50;
        }

        button.btn-add {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button.btn-add:hover {
            background-color: #45a049;
        }

        ul {
            list-style: none;
        }

        li {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-left: 4px solid #4CAF50;
        }

        li.completed {
            text-decoration: line-through;
            opacity: 0.6;
            border-left-color: #888;
        }

        .delete-btn {
            background: #ff5252;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #e04848;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lista de Tareas</h1>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Añadir nueva tarea...">
            <button class="btn-add" onclick="addTask()">Agregar</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            const input = document.getElementById('taskInput');
            const taskText = input.value.trim();

            if (taskText === '') return;

            const ul = document.getElementById('taskList');
            const li = document.createElement('li');

            li.innerHTML = `
                <span onclick="toggleTask(this)">${taskText}</span>
                <button class="delete-btn" onclick="deleteTask(this)">Eliminar</button>
            `;

            ul.appendChild(li);
            input.value = '';
        }

        function toggleTask(element) {
            element.parentElement.classList.toggle('completed');
        }

        function deleteTask(button) {
            button.parentElement.remove();
        }
    </script>

</body>
</html>
