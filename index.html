<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoloCode - Aprende a Programar</title>
    <style>
        :root {
            --bg-dark: #121826;
            --card-dark: #1e293b;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --editor-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header / Navbar */
        header {
            background-color: var(--card-dark);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 20px;
        }

        /* Navigation Tabs */
        nav {
            background: var(--card-dark);
            display: flex;
            justify-content: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding: 8px 0;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.08);
        }

        .tab-btn.active {
            border-bottom: 3px solid var(--accent);
        }

        /* Layout Main */
        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* Course Path View */
        .course-header {
            margin-bottom: 24px;
            text-align: center;
        }

        .course-title {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .modules-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .module-card {
            background: var(--card-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .module-info h3 {
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .module-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .btn-start {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-start:hover {
            background: var(--accent-hover);
        }

        /* Interactive Lesson & Quiz Modal */
        .lesson-container {
            background: var(--card-dark);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            max-width: 650px;
            margin: 0 auto;
        }

        .progress-bar-wrap {
            background: var(--border);
            height: 8px;
            border-radius: 4px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .lesson-title {
            font-size: 1.3rem;
            margin-bottom: 16px;
        }

        .lesson-text {
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .code-snippet {
            background: var(--editor-bg);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            color: #38bdf8;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 14px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: var(--accent);
            background: rgba(34, 197, 94, 0.05);
        }

        .option-btn.selected {
            border-color: var(--accent);
            background: rgba(34, 197, 94, 0.15);
        }

        /* Code Playground View */
        .playground-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            height: 550px;
        }

        @media (max-width: 768px) {
            .playground-container {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        .editor-box, .preview-box {
            background: var(--card-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .box-header {
            background: rgba(0,0,0,0.2);
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea.code-editor {
            flex: 1;
            background: var(--editor-bg);
            color: #f1f5f9;
            border: none;
            padding: 16px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 250px;
        }

        iframe.preview-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            min-height: 250px;
        }

        .btn-run {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header / Stats -->
    <header>
        <div class="logo">
            <span>&lt;/&gt;</span> SoloCode
        </div>
        <div class="stats-bar">
            <div class="stat-item" title="Racha de días">
                🔥 <span id="streak-count">1</span>
            </div>
            <div class="stat-item" title="Puntos de Experiencia">
                ⚡ <span id="xp-count">0</span> XP
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav>
        <button class="tab-btn active" onclick="switchTab('learn')">Aprender</button>
        <button class="tab-btn" onclick="switchTab('playground')">Code Playground</button>
    </nav>

    <!-- Main Content Area -->
    <main>
        <!-- View: Learn / Courses -->
        <section id="view-learn" class="view-section active">
            <div class="course-header">
                <h2 class="course-title">Curso: Introducción a Web (HTML & JS)</h2>
                <p style="color: var(--text-muted);">Domina los fundamentos del desarrollo web paso a paso</p>
            </div>

            <div class="modules-list" id="modules-list">
                <!-- Se cargan dinámicamente -->
            </div>
        </section>

        <!-- View: Lesson / Quiz Modal View -->
        <section id="view-lesson" class="view-section">
            <div class="lesson-container">
                <div class="progress-bar-wrap">
                    <div class="progress-bar-fill" id="lesson-progress"></div>
                </div>
                
                <h3 class="lesson-title" id="lesson-title">Cargando...</h3>
                <div class="lesson-text" id="lesson-content"></div>
                
                <div id="code-snippet-box" class="code-snippet" style="display: none;"></div>

                <div class="options-grid" id="options-container">
                    <!-- Opciones del quiz -->
                </div>

                <button class="btn-start" style="width: 100%;" id="btn-next" onclick="nextStep()">Continuar</button>
            </div>
        </section>

        <!-- View: Code Playground -->
        <section id="view-playground" class="view-section">
            <div class="playground-container">
                <div class="editor-box">
                    <div class="box-header">
                        <span>CÓDIGO (HTML + JS)</span>
                        <button class="btn-run" onclick="runCode()">Ejecutar ▶</button>
                    </div>
                    <textarea id="code-input" class="code-editor" spellcheck="false"><!-- Escribe tu código aquí -->
<h1>¡Hola Mundo!</h1>
<p>Probrando el Playground estilo SoloLearn.</p>

<button onclick="saludar()">Haz clic aquí</button>

<script>
  function saludar() {
    alert("¡Código ejecutado correctamente!");
  }
</script></textarea>
                </div>

                <div class="preview-box">
                    <div class="box-header">VISTA PREVIA</div>
                    <iframe id="preview-output" class="preview-frame"></iframe>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Data Base de Lecciones estilo SoloLearn
        const courseData = [
            {
                id: 1,
                title: "1. Introducción a HTML",
                desc: "Aprende la estructura básica de cualquier página web.",
                steps: [
                    {
                        type: "theory",
                        title: "¿Qué es HTML?",
                        content: "HTML significa <b>HyperText Markup Language</b>. Se utiliza para estructurar el contenido de las páginas web mediante elementos llamados <b>etiquetas</b>.",
                        code: "<h1>Este es un título principal</h1>\n<p>Este es un párrafo de texto.</p>"
                    },
                    {
                        type: "quiz",
                        title: "Comprobación de conocimiento",
                        content: "¿Cuál es la etiqueta correcta para definir un párrafo?",
                        options: ["<paragraph>", "<p>", "<text>", "<párrafo>"],
                        correct: 1
                    }
                ]
            },
            {
                id: 2,
                title: "2. Botones e Interacción",
                desc: "Añade elementos con los que el usuario puede interactuar.",
                steps: [
                    {
                        type: "theory",
                        title: "La etiqueta <button>",
                        content: "Para permitir que los usuarios realicen acciones, utilizamos la etiqueta <b>&lt;button&gt;</b>.",
                        code: "<button>Haz clic aquí</button>"
                    },
                    {
                        type: "quiz",
                        title: "Prueba rápida",
                        content: "¿Qué etiqueta crea un botón interactivo?",
                        options: ["<input type='btn'>", "<click>", "<button>", "<action>"],
                        correct: 2
                    }
                ]
            }
        ];

        // Estado del Usuario
        let userStats = JSON.parse(localStorage.getItem('solocode_stats')) || { xp: 0, streak: 1 };
        let currentModuleIndex = 0;
        let currentStepIndex = 0;
        let selectedOption = null;

        // Inicialización
        document.addEventListener("DOMContentLoaded", () => {
            updateStatsUI();
            renderModules();
            runCode(); // Ejecutar contenido inicial del editor
        });

        function updateStatsUI() {
            document.getElementById('xp-count').textContent = userStats.xp;
            document.getElementById('streak-count').textContent = userStats.streak;
            localStorage.setItem('solocode_stats', JSON.stringify(userStats));
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));

            if (tab === 'learn') {
                document.getElementById('view-learn').classList.add('active');
                event.target.classList.add('active');
            } else if (tab === 'playground') {
                document.getElementById('view-playground').classList.add('active');
                event.target.classList.add('active');
                runCode();
            }
        }

        // Renderizar Lista de Módulos
        function renderModules() {
            const container = document.getElementById('modules-list');
            container.innerHTML = '';

            courseData.forEach((mod, idx) => {
                const card = document.createElement('div');
                card.className = 'module-card';
                card.innerHTML = `
                    <div class="module-info">
                        <h3>${mod.title}</h3>
                        <p>${mod.desc}</p>
                    </div>
                    <button class="btn-start" onclick="startModule(${idx})">Iniciar</button>
                `;
                container.appendChild(card);
            });
        }

        // Lógica de Lecciones
        function startModule(index) {
            currentModuleIndex = index;
            currentStepIndex = 0;
            
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('view-lesson').classList.add('active');
            
            loadStep();
        }

        function loadStep() {
            selectedOption = null;
            const currentModule = courseData[currentModuleIndex];
            const step = currentModule.steps[currentStepIndex];
            
            // Barra de progreso
            const progress = ((currentStepIndex + 1) / currentModule.steps.length) * 100;
            document.getElementById('lesson-progress').style.width = `${progress}%`;

            // Textos
            document.getElementById('lesson-title').textContent = step.title;
            document.getElementById('lesson-content').innerHTML = step.content;

            const snippetBox = document.getElementById('code-snippet-box');
            if (step.code) {
                snippetBox.textContent = step.code;
                snippetBox.style.display = 'block';
            } else {
                snippetBox.style.display = 'none';
            }

            // Opciones de Cuestionario
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            if (step.type === 'quiz') {
                step.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.onclick = () => selectOption(btn, idx);
                    optionsContainer.appendChild(btn);
                });
            }
        }

        function selectOption(btnElement, index) {
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btnElement.classList.add('selected');
            selectedOption = index;
        }

        function nextStep() {
            const currentModule = courseData[currentModuleIndex];
            const step = currentModule.steps[currentStepIndex];

            // Validar opción en caso de ser Quiz
            if (step.type === 'quiz') {
                if (selectedOption === null) {
                    alert("Por favor, selecciona una respuesta.");
                    return;
                }
                if (selectedOption !== step.correct) {
                    alert("❌ Respuesta incorrecta. ¡Inténtalo de nuevo!");
                    return;
                }
                // Otorgar Experiencia
                userStats.xp += 10;
                updateStatsUI();
            }

            // Siguiente paso o completar módulo
            if (currentStepIndex < currentModule.steps.length - 1) {
                currentStepIndex++;
                loadStep();
            } else {
                alert("🎉 ¡Felicidades! Has completado esta lección. (+10 XP)");
                switchTab('learn');
            }
        }

        // Playground: Compilador en tiempo real
        function runCode() {
            const code = document.getElementById('code-input').value;
            const previewFrame = document.getElementById('preview-output');
            
            const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            previewDoc.open();
            previewDoc.write(code);
            previewDoc.close();
        }
    </script>
</body>
</html>
