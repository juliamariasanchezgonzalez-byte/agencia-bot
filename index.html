<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MercaAhumados MM - POS</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --m-green: #22c55e;
            --m-pink: #ec4899;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 15px 20px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px;
            flex-wrap: wrap; gap: 10px;
        }

        .brand-logo {
            display: flex; align-items: center; gap: 8px; font-size: 1.8rem; font-weight: 800;
        }
        .m-green { color: var(--m-green); }
        .m-pink { color: var(--m-pink); }
        .brand-name { color: var(--text); }

        .container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        /* Módulo de Productos */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .product-card {
            background: var(--card-bg); border-radius: 12px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; padding: 10px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .product-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        .product-card h3 { font-size: 1rem; margin: 8px 0; }
        .product-card .price { font-weight: bold; color: var(--primary); }
        .product-card .stock { font-size: 0.85rem; color: #64748b; margin-bottom: 8px; }
        
        button {
            background: var(--primary); color: white; border: none; padding: 8px 12px;
            border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%;
        }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* Módulo de Venta / Carrito */
        .cart-panel, .report-panel {
            background: var(--card-bg); border-radius: 12px; padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px;
        }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px; }
        .total-box { font-size: 1.25rem; font-weight: bold; margin: 15px 0; text-align: right; }
        .btn-pay { background: var(--success); font-size: 1.1rem; padding: 12px; }

        /* Dashboard de Métricas */
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .metric-card { background: #f1f5f9; padding: 12px; border-radius: 8px; text-align: center; }
        .metric-card span { display: block; font-size: 0.8rem; color: #64748b; }
        .metric-card strong { font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <span class="brand-name">MercaAhumados</span>
            <span><span class="m-green">M</span><span class="m-pink">M</span></span>
        </div>
        <span>Sistema Punto de Venta e Inventario</span>
    </header>

    <div class="container">
        <section>
            <h2>Productos Disponibles</h2>
            <br>
            <div class="products-grid" id="products-list"></div>
        </section>

        <aside>
            <div class="cart-panel">
                <h2>Venta Actual</h2>
                <div id="cart-items" style="margin-top: 15px;"></div>
                <div class="total-box">Total: $<span id="cart-total">0.00</span></div>
                <button class="btn-pay" onclick="procesarVenta()">Cobrar y Registrar</button>
            </div>

            <div class="report-panel">
                <h2>Resumen de Ventas</h2>
                <br>
                <div class="metrics">
                    <div class="metric-card">
                        <span>Ingresos Totales</span>
                        <strong id="total-revenue">$0.00</strong>
                    </div>
                    <div class="metric-card">
                        <span>Items Vendidos</span>
                        <strong id="total-units">0</strong>
                    </div>
                </div>
                <h3>Inventario Restante</h3>
                <ul id="stock-report" style="list-style: none; margin-top: 10px; font-size: 0.9rem;"></ul>
            </div>
        </aside>
    </div>

    <script>
        // Datos Iniciales
        const productos = [
            { id: 1, nombre: "Pollo Ahumado", precio: 8.50, stock: 20, img: "https://encrypted-tbn1.gstatic.com/licensed-image?q=tbn:ANd9GcQ9LHi5YWCxXoqkOAz7uSzw87KLTYwDhWVnoIISuhTCvEW96TV5QpkT5yapWHV4NXwCa4D80zCzJdoucIE" },
            { id: 2, nombre: "Hamburguesa", precio: 4.00, stock: 35, img: "https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcQYs7BibY-XUOBlOLJge8AQ2m5w0UEILxXgzMvdCaiAR-4ubm0_5Uor5Awp_KwULJhkb0IL-7ugdTzGiBE" },
            { id: 3, nombre: "Refresco de Cola", precio: 1.50, stock: 50, img: "https://encrypted-tbn2.gstatic.com/licensed-image?q=tbn:ANd9GcQ33xzkNdW_Gn3CLIKSfOxPuf8w9tAaBeXUX2VpdZOszkCxk0Xwr2nzb2lK5RO_6AjxD3hB1RxlAzSsm0k" }
        ];

        let carrito = [];
        let ventasTotales = 0;
        let unidadesVendidas = 0;

        // Cargar Catálogo
        function renderProductos() {
            const container = document.getElementById('products-list');
            container.innerHTML = '';
            productos.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}" alt="${p.nombre}">
                        <h3>${p.nombre}</h3>
                        <div class="price">$${p.precio.toFixed(2)}</div>
                        <div class="stock">Quedan: ${p.stock} un.</div>
                        <button onclick="agregarAlCarrito(${p.id})" ${p.stock === 0 ? 'disabled' : ''}>
                            ${p.stock === 0 ? 'Agotado' : 'Agregar'}
                        </button>
                    </div>
                `;
            });
            renderReportes();
        }

        // Agregar al Carrito
        function agregarAlCarrito(id) {
            const prod = productos.find(p => p.id === id);
            if (prod.stock > 0) {
                const item = carrito.find(i => i.id === id);
                if (item) {
                    if (item.cantidad < prod.stock) item.cantidad++;
                } else {
                    carrito.push({ ...prod, cantidad: 1 });
                }
                renderCarrito();
            }
        }

        // Renderizar Carrito
        function renderCarrito() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;
            
            carrito.forEach(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                container.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.nombre}</strong><br>
                            <small>$${item.precio} x ${item.cantidad}</small>
                        </div>
                        <div>$${subtotal.toFixed(2)}</div>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = total.toFixed(2);
        }

        // Procesar Venta / Salida de Stock
        function procesarVenta() {
            if (carrito.length === 0) return alert('El carrito está vacío');

            carrito.forEach(item => {
                const prod = productos.find(p => p.id === item.id);
                prod.stock -= item.cantidad;
                ventasTotales += item.precio * item.cantidad;
                unidadesVendidas += item.cantidad;
            });

            carrito = [];
            renderCarrito();
            renderProductos();
            alert('¡Venta realizada con éxito!');
        }

        // Actualizar Estadísticas
        function renderReportes() {
            document.getElementById('total-revenue').innerText = `$${ventasTotales.toFixed(2)}`;
            document.getElementById('total-units').innerText = unidadesVendidas;
            
            const stockList = document.getElementById('stock-report');
            stockList.innerHTML = '';
            productos.forEach(p => {
                stockList.innerHTML += `<li><strong>${p.nombre}:</strong> ${p.stock} disponibles</li>`;
            });
        }

        // Inicializar
        renderProductos();
    </script>
</body>
</html>
